name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository hygiene
        run: python3 -I scripts/check-repository.py
      - name: Test release configuration
        run: |
          python3 -I scripts/test-release-config.py
          python3 -I scripts/test-release-version.py
          python3 -I scripts/test-signing-session.py
      - name: Check shell syntax
        run: bash -n scripts/build-app.sh scripts/test.sh Tests/Fixtures/generate.sh
