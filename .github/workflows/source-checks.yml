name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-hygiene:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check repository hygiene
        run: bash scripts/release-tool.sh check-repository
      - name: Test release tool
        run: swift test --package-path Tools/ReleaseTool
      - name: Check shell syntax
        run: bash -n scripts/build-app.sh scripts/build-metal.sh scripts/test.sh Tests/Fixtures/generate.sh
